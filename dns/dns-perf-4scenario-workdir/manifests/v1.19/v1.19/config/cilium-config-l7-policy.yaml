apiVersion: v1
data:
  agent-not-ready-taint-key: node.cilium.io/agent-not-ready
  arping-refresh-period: 30s
  auto-direct-node-routes: "false"
  bpf-lb-external-clusterip: "false"
  bpf-lb-map-max: "65536"
  bpf-lb-mode: snat
  bpf-map-dynamic-size-ratio: "0.0025"
  bpf-policy-map-max: "16384"
  bpf-root: /sys/fs/bpf
  cgroup-root: /run/cilium/cgroupv2
  cilium-endpoint-gc-interval: 5m0s
  cluster-id: "0"
  cluster-name: default
  debug: "true"
  disable-cnp-status-updates: "true"
  disable-embedded-dns-proxy: "false"
  disable-endpoint-crd: "false"
  enable-auto-protect-node-port-range: "true"
  enable-bgp-control-plane: "false"
  enable-bpf-clock-probe: "true"
  enable-endpoint-health-checking: "false"
  enable-endpoint-routes: "true"
  enable-health-check-nodeport: "true"
  enable-health-checking: "true"
  enable-host-legacy-routing: "true"
  enable-ipv4: "true"
  enable-ipv4-masquerade: "false"
  enable-ipv6: "false"
  enable-ipv6-masquerade: "false"
  enable-k8s-terminating-endpoint: "true"
  enable-l2-neigh-discovery: "true"
  enable-l7-proxy: "true"
  enable-wireguard: "true"
  enable-local-node-route: "false"
  enable-local-redirect-policy: "true" # set to true for lrp test
  enable-metrics: "true"
  enable-policy: default
  enable-remote-node-identity: "true"
  enable-session-affinity: "true"
  enable-standalone-dns-proxy: "true"
  enable-svc-source-range-check: "true"
  enable-vtep: "false"
  enable-well-known-identities: "false"
  enable-xt-socket-fallback: "true"
  # Hubble
  enable-hubble: "true"
  hubble-socket-path: /var/run/cilium/hubble.sock
  hubble-event-buffer-capacity: "4095"
  hubble-metrics-server: :9965
  hubble-dynamic-metrics-config-path: /dynamic-metrics-config/dynamic-metrics.yaml  
  enable-hubble-open-metrics: "false"
  hubble-export-file-max-size-mb: "10"
  hubble-export-file-max-backups: "5"
  hubble-listen-address: ":4244"
  hubble-disable-tls: "false"
  hubble-tls-cert-file: /var/lib/cilium/tls/hubble/server.crt
  hubble-tls-key-file: /var/lib/cilium/tls/hubble/server.key
  hubble-tls-client-ca-files: /var/lib/cilium/tls/hubble/client-ca.crt
  hubble-flowlogs-config-path: /flowlog-config/flowlogs.yaml

  identity-allocation-mode: crd
  install-iptables-rules: "true"
  install-no-conntrack-iptables-rules: "false"
  ipam: delegated-plugin
  kube-proxy-replacement: "true"
  kube-proxy-replacement-healthz-bind-address: "0.0.0.0:10256"
  local-router-ipv4: 169.254.23.0
  metrics: +cilium_bpf_map_pressure
  monitor-aggregation: medium
  monitor-aggregation-flags: all
  monitor-aggregation-interval: 5s
  node-port-bind-protection: "true"
  nodes-gc-interval: 5m0s
  operator-api-serve-addr: 127.0.0.1:9234
  operator-prometheus-serve-addr: :9963
  preallocate-bpf-maps: "false"
  procfs: /host/proc
  prometheus-serve-addr: :9962
  remove-cilium-node-taints: "true"
  set-cilium-is-up-condition: "true"
  sidecar-istio-proxy-image: cilium/istio_proxy
  synchronize-k8s-nodes: "true"
  tofqdns-dns-reject-response-code: refused
  tofqdns-enable-dns-compression: "true"
  tofqdns-endpoint-max-ip-per-hostname: "1000"
  tofqdns-idle-connection-grace-period: 0s
  tofqdns-max-deferred-connection-deletes: "10000"
  tofqdns-min-ttl: "0"
  tofqdns-proxy-port: "10094"
  tofqdns-proxy-response-max-delay: 100ms
  standalone-dns-proxy-server-port: "10095"
  routing-mode: native
  unmanaged-pod-watcher-interval: "15s"
  vtep-cidr: ""
  vtep-endpoint: ""
  vtep-mac: ""
  vtep-mask: ""
  # new default values from Cilium v1.14.4
  enable-sctp: "false"
  external-envoy-proxy: "true"
  k8s-client-qps: "10"
  k8s-client-burst: "20"
  mesh-auth-enabled: "true"
  mesh-auth-queue-size: "1024"
  mesh-auth-rotated-identities-queue-size: "1024"
  mesh-auth-gc-interval: "5m0s"
  proxy-connect-timeout: "2"
  proxy-idle-timeout-seconds: "60"
  proxy-max-requests-per-connection: "0"
  proxy-max-connection-duration-seconds: "0"
  proxy-xff-num-trusted-hops-ingress: "0"
  proxy-xff-num-trusted-hops-egress: "0"
  set-cilium-node-taints: "true"
  ## new values added for 1.16 below
  enable-ipv4-big-tcp: "false"
  enable-ipv6-big-tcp: "false"
  enable-masquerade-to-route-source: "false"
  enable-health-check-loadbalancer-ip: "false"
  bpf-lb-acceleration: "disabled"
  enable-k8s-networkpolicy: "true"
  cni-exclusive: "false" # Cilium takes ownership of /etc/cni/net.d, pods cannot be scheduled with any other cni if cilium is down
  cni-log-file: "/var/run/cilium/cilium-cni.log"
  ipam-cilium-node-update-rate: "15s"
  egress-gateway-reconciliation-trigger-interval: "1s"
  nat-map-stats-entries: "32"
  nat-map-stats-interval: "30s"
  bpf-events-drop-enabled: "true" # exposes drop events to cilium monitor/hubble
  bpf-events-policy-verdict-enabled: "true" # exposes policy verdict events to cilium monitor/hubble
  bpf-events-trace-enabled: "true" # exposes trace events to cilium monitor/hubble
  enable-tcx: "false" # attach endpoint programs with tcx if supported by kernel
  datapath-mode: "veth"
  direct-routing-skip-unreachable: "false"
  enable-runtime-device-detection: "false"
  bpf-lb-sock: "false"
  bpf-lb-sock-terminate-pod-connections: "false"
  nodeport-addresses: ""
  k8s-require-ipv4-pod-cidr: "false"
  k8s-require-ipv6-pod-cidr: "false"
  enable-node-selector-labels: "false"
  ## new values for 1.17
  ces-slice-mode: "fcfs"
  enable-cilium-endpoint-slice: "true"
  bpf-lb-source-range-all-types: "false"
  bpf-algorithm-annotation: "false"
  bpf-lb-mode-annotation: "false"
  enable-experimental-lb: "false"
  enable-endpoint-lockdown-on-policy-overflow: "false"
  health-check-icmp-failure-threshold: "3"
  enable-internal-traffic-policy: "true"
  enable-lb-ipam: "false"
  enable-non-default-deny-policies: "true"
  enable-source-ip-verification: "false"
  enable-telemetry: "true"
  log-opt: "{\"level\":\"info\"}"
  leader-election: "true"
  hubble-flowlogs-configmapname: acns-flowlog-config
  flowlogs.yaml: |
    flowLogs:
      - name: all
        fieldAggregate: ["verdict", "is_reply", "drop_reason_desc", "source.namespace", "destination.namespace", "source.workloads", "destination.workloads", "l4.TCP.destination_port", "l4.UDP.destination_port", "l7.http.code", "l7.dns.rcode", "IP.ipVersion", "IP.encrypted", "source.cluster_name", "destination.cluster_name"]
        aggregationInterval: "2s"
        fieldMask: ["time", "verdict", "ethernet", "drop_reason", "drop_reason_desc", "interface", "proxy_port", "auth_type", "IP", "l4", "l7", "Type", "node_name", "source_names", "destination_names", "event_type", "debug_capture_point", "traffic_direction", "policy_match_type", "is_reply", "reply", "Summary", "source_service", "destination_service", "trace_context", "trace_reason", "trace_observation_point", "sock_xlate_point", "socket_cookie", "cgroup_id", "extensions", "source.ID", "source.namespace", "source.identity", "source.pod_name", "source.workloads", "source.cluster_name", "destination.ID", "destination.namespace", "destination.identity", "destination.pod_name", "destination.cluster_name", "destination.workloads", "egress_allowed_by", "egress_denied_by", "ingress_denied_by", "ingress_allowed_by"] 
        includeFilters: []
        excludeFilters: []
        filePath: "/var/log/acns/hubble/events.log"
  hubble-metrics-config.yaml: |
    config:
      configMap:
        name: cilium-dynamic-metrics-config
        createConfigMap: false
      content:
          - name: "flow"
            contextOptions:
              - name: "destinationIngressContext"
                values: ["pod"]
              - name: "sourceEgressContext"
                values: ["pod"]
          - name: "tcp"
            contextOptions:
              - name: "destinationIngressContext"
                values: ["pod"]
              - name: "sourceEgressContext"
                values: ["pod"]
          - name: "drop"
            contextOptions:
              - name: "destinationIngressContext"
                values: ["pod"]
              - name: "sourceEgressContext"
                values: ["pod"]
          - name: "dns"
            contextOptions:
              - name: "destinationIngressContext"
                values: ["pod"]
              - name: "sourceEgressContext"
                values: ["pod"]
  ## new values for 1.18
  # bpf-policy-stats-map-max specifies the maximum number of entries in global
  # policy stats map
  bpf-policy-stats-map-max: "65536"
  identity-management-mode: "operator"
  tofqdns-preallocate-identities:  "true"
  policy-default-local-cluster: "false"
## new values for 1.19
  # azure-interface-name specifies the name of the network interface used for Azure IPAM (empty means auto-detect)
  azure-interface-name: ""
  # enable-tunnel-big-tcp enables BIG TCP for tunnel traffic (vxlan/geneve) to improve performance with TSO/GRO
  enable-tunnel-big-tcp: "false"
  # policy-deny-response configures the response sent when a request is denied by policy (none, drop, reset, reject)
  policy-deny-response: "none"
  # enable-standalone-dns-proxy enables the standalone DNS proxy server (alpha feature)
  enable-standalone-dns-proxy: "false"
  # clustermesh-cache-ttl sets the TTL for cached data in clustermesh (0s means never expire)
  clustermesh-cache-ttl: "0s"
  # ipam-max-allocate sets the maximum number of IPs that can be allocated beyond current need
  ipam-max-allocate: ""
  # ipam-min-allocate sets the minimum number of IPs that should be allocated per node
  ipam-min-allocate: ""
  # ipam-pre-allocate sets the number of IPs to pre-allocate beyond available addresses
  ipam-pre-allocate: ""
kind: ConfigMap
metadata:
  annotations:
    meta.helm.sh/release-name: cilium
    meta.helm.sh/release-namespace: kube-system
  labels:
    app.kubernetes.io/managed-by: Helm
  name: cilium-config
  namespace: kube-system
