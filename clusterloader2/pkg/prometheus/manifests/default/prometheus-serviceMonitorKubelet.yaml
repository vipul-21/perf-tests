{{$PROMETHEUS_SCRAPE_KUBELETS := DefaultParam .PROMETHEUS_SCRAPE_KUBELETS false}}

{{if $PROMETHEUS_SCRAPE_KUBELETS}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    k8s-app: kubelet
  name: kubelet
  namespace: monitoring
spec:
  jobLabel: k8s-app
  endpoints:
  - port: https-metrics
    scheme: https
    interval: 60s
    tlsConfig:
      insecureSkipVerify: true
    bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabelings:
      # Sample ~10% of kubelets using hashmod (same deterministic set every scrape)
      - sourceLabels: [__address__]
        modulus: 10
        targetLabel: __tmp_hash
        action: hashmod
      - sourceLabels: [__tmp_hash]
        regex: '^0$'
        action: keep
    metricRelabelings:
      - sourceLabels: [__name__]
        regex: kubelet_pod_worker_duration_seconds_.*|kubelet_pod_start_duration_seconds_.*|kubelet_pleg_relist_duration_seconds_.*
        action: keep
  - port: https-metrics
    scheme: https
    path: /metrics/cadvisor
    interval: 30s
    honorLabels: true
    tlsConfig:
      insecureSkipVerify: true
    bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabelings:
      # Sample ~10% of cAdvisor endpoints using hashmod (same set as kubelet above)
      - sourceLabels: [__address__]
        modulus: 10
        targetLabel: __tmp_hash
        action: hashmod
      - sourceLabels: [__tmp_hash]
        regex: '^0$'
        action: keep
    metricRelabelings:
      - sourceLabels: [__name__]
        regex: container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_memory_usage_bytes|container_cpu_cfs_throttled_periods_total|container_cpu_cfs_periods_total
        action: keep
      - sourceLabels: [container]
        regex: kube-apiserver|cilium-agent|cilium-operator|apiserver|etcd|kvstoremesh
        action: keep
  selector:
    matchLabels:
      k8s-app: kubelet
  namespaceSelector:
    matchNames:
    - kube-system
{{end}}
