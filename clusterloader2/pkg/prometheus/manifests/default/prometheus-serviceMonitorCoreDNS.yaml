{{$PROMETHEUS_SCRAPE_COREDNS := DefaultParam .PROMETHEUS_SCRAPE_COREDNS false}}

{{if $PROMETHEUS_SCRAPE_COREDNS}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    k8s-app: coredns
  name: coredns
  namespace: monitoring
spec:
  endpoints:
  - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    interval: 10s
    port: metrics
  jobLabel: k8s-app
  namespaceSelector:
    matchNames:
    - kube-system
  selector:
    matchLabels:
      k8s-app: kube-dns
{{end}}
