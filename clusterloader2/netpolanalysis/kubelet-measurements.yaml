{{$action := .action}} # start, gather

steps:
  - name: {{$action}} Kubelet Measurements
    measurements:
    - Identifier: KubeletPodStartupSLIDuration
      Method: GenericPrometheusQuery
      Params:
        action: {{$action}}
        metricName: KubeletPodStartupSLIDuration
        metricVersion: v1
        unit: s
        dimensions:
          - node
        queries:
        - name: Perc99
          query: histogram_quantile(0.99, sum(rate(kubelet_pod_start_sli_duration_seconds_bucket[10m])) by (node, le))
        - name: Perc90
          query: histogram_quantile(0.90, sum(rate(kubelet_pod_start_sli_duration_seconds_bucket[10m])) by (node, le))
        - name: Perc50
          query: histogram_quantile(0.50, sum(rate(kubelet_pod_start_sli_duration_seconds_bucket[10m])) by (node, le))
    - Identifier: KubeletPodStartupSLIDurationOverall
      Method: GenericPrometheusQuery
      Params:
        action: {{$action}}
        metricName: KubeletPodStartupSLIDurationOverall
        metricVersion: v1
        unit: s
        queries:
        - name: Perc99
          query: histogram_quantile(0.99, sum(rate(kubelet_pod_start_sli_duration_seconds_bucket[10m])) by (le))
        - name: Perc90
          query: histogram_quantile(0.90, sum(rate(kubelet_pod_start_sli_duration_seconds_bucket[10m])) by (le))
        - name: Perc50
          query: histogram_quantile(0.50, sum(rate(kubelet_pod_start_sli_duration_seconds_bucket[10m])) by (le))
    - Identifier: KubeletPodStartupDuration
      Method: GenericPrometheusQuery
      Params:
        action: {{$action}}
        metricName: KubeletPodStartupDuration
        metricVersion: v1
        unit: s
        dimensions:
          - node
        queries:
        - name: Perc99
          query: histogram_quantile(0.99, sum(rate(kubelet_pod_start_duration_seconds_bucket[10m])) by (node, le))
        - name: Perc90
          query: histogram_quantile(0.90, sum(rate(kubelet_pod_start_duration_seconds_bucket[10m])) by (node, le))
        - name: Perc50
          query: histogram_quantile(0.50, sum(rate(kubelet_pod_start_duration_seconds_bucket[10m])) by (node, le))
    - Identifier: KubeletPodStartupDurationOverall
      Method: GenericPrometheusQuery
      Params:
        action: {{$action}}
        metricName: KubeletPodStartupDurationOverall
        metricVersion: v1
        unit: s
        queries:
        - name: Perc99
          query: histogram_quantile(0.99, sum(rate(kubelet_pod_start_duration_seconds_bucket[10m])) by (le))
        - name: Perc90
          query: histogram_quantile(0.90, sum(rate(kubelet_pod_start_duration_seconds_bucket[10m])) by (le))
        - name: Perc50
          query: histogram_quantile(0.50, sum(rate(kubelet_pod_start_duration_seconds_bucket[10m])) by (le))
    - Identifier: KubeletPodStartupTotalDuration
      Method: GenericPrometheusQuery
      Params:
        action: {{$action}}
        metricName: KubeletPodStartupTotalDuration
        metricVersion: v1
        unit: s
        queries:
        - name: Perc99
          query: histogram_quantile(0.99, sum(rate(kubelet_pod_start_total_duration_seconds_bucket[10m])) by (le))
        - name: Perc90
          query: histogram_quantile(0.90, sum(rate(kubelet_pod_start_total_duration_seconds_bucket[10m])) by (le))
        - name: Perc50
          query: histogram_quantile(0.50, sum(rate(kubelet_pod_start_total_duration_seconds_bucket[10m])) by (le))
    - Identifier: KubeletRuntimeOperationDuration
      Method: GenericPrometheusQuery
      Params:
        action: {{$action}}
        metricName: KubeletRuntimeOperationDuration
        metricVersion: v1
        unit: s
        dimensions:
          - operation_type
        queries:
        - name: Perc99
          query: histogram_quantile(0.99, sum(rate(kubelet_runtime_operations_duration_seconds_bucket{node=~".*"}[10m])) by (operation_type, le))
        - name: Perc90
          query: histogram_quantile(0.90, sum(rate(kubelet_runtime_operations_duration_seconds_bucket{node=~".*"}[10m])) by (operation_type, le))
        - name: Perc50
          query: histogram_quantile(0.50, sum(rate(kubelet_runtime_operations_duration_seconds_bucket{node=~".*"}[10m])) by (operation_type, le))
