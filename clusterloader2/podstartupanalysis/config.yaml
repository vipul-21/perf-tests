name: load-config

# Config options for test parameters
{{$podsPerNode := DefaultParam .CL2_PODS_PER_NODE 50}} 
{{$deploymentSize := DefaultParam .CL2_DEPLOYMENT_SIZE 100}} 
{{$repeats := DefaultParam .CL2_REPEATS 1}}
{{$groupName := DefaultParam .CL2_GROUP_NAME "service-discovery"}}

{{$namespaces := 100}}
{{$nodes := DefaultParam .CL2_NODES 1000}} 

{{$operationTimeout := DefaultParam .CL2_OPERATION_TIMEOUT "15m"}}
{{$totalPods := MultiplyInt $nodes $podsPerNode}} 
{{$podsPerNamespace := DivideInt $totalPods $namespaces}} 
{{$deploymentsPerNamespace := DivideInt $podsPerNamespace $deploymentSize}} 

{{$latencyPodCpu := DefaultParam .CL2_LATENCY_POD_CPU 10}}
{{$latencyPodMemory := DefaultParam .CL2_LATENCY_POD_MEMORY 50}}
{{$podStartupLatencyThreshold := DefaultParam .CL2_POD_STARTUP_LATENCY_THRESHOLD "15s"}}

{{$CILIUM_METRICS_ENABLED := DefaultParam .CL2_CILIUM_METRICS_ENABLED false}}
{{$KUBELET_METRICS_ENABLED := DefaultParam .CL2_KUBELET_METRICS_ENABLED false}}

# QPS
# We use RandomizedTimeLimitedLoad for load QPS.
# Specifically, we aim to create/delete LOAD_TEST_THROUGHPUT/DELETE_TEST_THROUGHPUT pods per second, on average.
# Operations make an independent choice about the time to start uniformly at random from the associated time period.
{{$LOAD_TEST_THROUGHPUT := DefaultParam .CL2_LOAD_TEST_THROUGHPUT 100}}
{{$DELETE_TEST_THROUGHPUT := DefaultParam .CL2_DELETE_TEST_THROUGHPUT $LOAD_TEST_THROUGHPUT}}
{{$saturationTime := DivideInt $totalPods $LOAD_TEST_THROUGHPUT}}
{{$deletionTime := DivideInt $totalPods $DELETE_TEST_THROUGHPUT}}

namespace:
  number: {{$namespaces}}
  prefix: slo
  deleteStaleNamespaces: true
  deleteAutomanagedNamespaces: true
  enableExistingNamespaces: true

tuningSets:
  - name: Sequence
    parallelismLimitedLoad:
      parallelismLimit: 1
  - name: RandomizedSaturationTimeLimited
    RandomizedTimeLimitedLoad:
      timeLimit: {{$saturationTime}}s
  - name: RandomizedDeletionTimeLimited
    RandomizedTimeLimitedLoad:
      timeLimit: {{$deletionTime}}s

steps:
  - name: Log - namespaces={{$namespaces}}, podsPerNode={{$podsPerNode}}, totalPods={{$totalPods}}, podsPerNamespace={{$podsPerNamespace}}, deploymentSize={{$deploymentSize}}, deploymentsPerNamespace={{$deploymentsPerNamespace}}, repeats={{$repeats}}, $saturationTime={{$saturationTime}}, $deletionTime={{$deletionTime}}
    measurements:
    - Identifier: Dummy
      Method: Sleep
      Params:
        action: start
        duration: 1ms

  - module:
      path: /measurements.yaml
      params:
        action: start
        group: {{$groupName}}
  - module:
      path: /measurements-baseline.yaml
      params:
        action: start
        group: {{$groupName}}

{{if $CILIUM_METRICS_ENABLED}}
  - module:
      path: /cilium-measurements.yaml
      params:
        action: start
  - module:
      path: /cilium-baseline-measurements.yaml
      params:
        action: start
{{end}}

{{if $KUBELET_METRICS_ENABLED}}
  - module:
      path: /kubelet-measurements.yaml
      params:
        action: start
{{end}}
  - name: Log - Baseline measurements collected"
    measurements:
    - Identifier: Dummy-Sleep-Before-Load
      Method: Sleep
      Params:
        action: start
        duration: 120s  # Wait 120 seconds for baseline metrics to accumulate
  - module:
      path: /measurements-baseline.yaml
      params:
        action: gather
        group: {{$groupName}}

  # Gather Cilium baseline metrics before workload starts
  - module:
      path: /cilium-baseline-measurements.yaml
      params:
        action: gather

## collect the mesurements for pod startup latency before starting the load
{{range $i := Loop $repeats}}
  - module:
      path: /reconcile-objects.yaml
      params:
        actionName: "create"
        namespaces: {{$namespaces}}
        tuningSet: RandomizedSaturationTimeLimited
        operationTimeout: {{$operationTimeout}}
        deploymentSize: {{$deploymentSize}}
        deploymentsPerNamespace: {{$deploymentsPerNamespace}}
        CpuRequest: {{$latencyPodCpu}}m
        MemoryRequest: {{$latencyPodMemory}}M
        Group: {{$groupName}}
        deploymentLabel: start
  # - module:
  # don't delete the pods after the test and continue collecting measurements.
      # path: /reconcile-objects.yaml
      # params:
      #   actionName: "delete"
      #   namespaces: {{$namespaces}}
      #   tuningSet: RandomizedSaturationTimeLimited
      #   operationTimeout: {{$operationTimeout}}
      #   deploymentSize: {{$deploymentSize}}
      #   deploymentsPerNamespace: 0
      #   CpuRequest: {{$latencyPodCpu}}m
      #   MemoryRequest: {{$latencyPodMemory}}M
      #   Group: {{$groupName}}
      #   deploymentLabel: start
{{end}}

{{if $KUBELET_METRICS_ENABLED}}
  - module:
      path: /kubelet-measurements.yaml
      params:
        action: gather
{{end}}

{{if $CILIUM_METRICS_ENABLED}}
  - module:
      path: /cilium-measurements.yaml
      params:
        action: gather
{{end}}

  - module:
      path: /measurements.yaml
      params:
        action: gather
        group: {{$groupName}}
